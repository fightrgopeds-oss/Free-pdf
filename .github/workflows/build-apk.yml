name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Bundle PDF.js with XFA support
        run: |
          mkdir -p app/src/main/assets/pdfjs
          curl -fsSL https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js -o app/src/main/assets/pdfjs/pdf.min.js
          curl -fsSL https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js -o app/src/main/assets/pdfjs/pdf.worker.min.js
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FreePDFReader-XFA-debug
          path: app/build/outputs/apk/debug/app-debug.apk
