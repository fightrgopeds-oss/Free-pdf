<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><style>*{box-sizing:border-box}body{margin:0;background:#f9f8f7;color:#2c2c2b;font-family:Arial,sans-serif;height:100vh;display:flex;flex-direction:column}.top{height:72px;background:#fff;display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #e6e5e3}.logo{width:42px;height:48px;border-radius:10px;background:#2783de;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:bold}.title{font-size:19px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}.btn{border:0;border-radius:10px;background:#2783de;color:#fff;min-height:48px;padding:0 18px;font-size:15px}.stage{flex:1;overflow:auto;padding:12px;display:flex;justify-content:center;align-items:flex-start}.empty{align-self:center;text-align:center;padding:32px}.empty .pdf{width:82px;height:82px;border-radius:12px;background:#2783de;color:#fff;display:grid;place-items:center;font-size:27px;font-weight:bold;margin:auto}.empty h2{font-size:22px;margin:24px 0 8px}.empty p{font-size:15px;color:#7d7a75;line-height:1.5;margin:0 0 24px}.paper{display:none;background:#fff;border:1px solid #e6e5e3;box-shadow:0 1px 2px #0000000d;max-width:none}.bar{display:none;height:64px;background:#fff;border-top:1px solid #e6e5e3;padding:8px 12px;align-items:center;gap:8px}.bar button{height:48px;border:1px solid #d9d8d6;border-radius:10px;background:#fff;color:#2c2c2b;font-size:15px;min-width:48px}.bar .wide{flex:1}.count{min-width:104px;text-align:center;font-size:15px}.loading,.error{display:none;align-self:center;text-align:center;padding:24px;color:#7d7a75}.error{color:#b33}@media(prefers-color-scheme:dark){body,.stage{background:#191919;color:#fff}.top,.bar{background:#202020;border-color:#444}.bar button{background:#383836;color:#fff;border-color:#555}.title{color:#fff}.paper{border-color:#444}}</style></head><body><header class="top"><div class="logo">PDF</div><div class="title" id="title">Free PDF Reader</div><button class="btn" onclick="Android.choosePdf()">Open PDF</button></header><main class="stage"><section class="empty" id="empty"><div class="pdf">PDF</div><h2>Open your first PDF</h2><p>Standard and XFA PDFs supported.<br>Your files stay on your device.</p><button class="btn" onclick="Android.choosePdf()">Choose a PDF</button></section><div class="loading" id="loading">Opening document…</div><div class="error" id="error">This document could not be rendered.</div><canvas class="paper" id="canvas"></canvas></main><footer class="bar" id="bar"><button class="wide" onclick="go(-1)">‹ Prev</button><button onclick="zoomBy(-.25)">−</button><div class="count" id="count">1 / 1 · 125%</div><button onclick="zoomBy(.25)">+</button><button class="wide" onclick="go(1)">Next ›</button></footer><script src="pdfjs/pdf.min.js"></script><script>pdfjsLib.GlobalWorkerOptions.workerSrc='pdfjs/pdf.worker.min.js';let doc=null,pageNo=1,scale=1.25,job=0;const $=id=>document.getElementById(id);async function loadPdf(url,name){$('title').textContent=name||'PDF document';$('empty').style.display='none';$('error').style.display='none';$('canvas').style.display='none';$('bar').style.display='none';$('loading').style.display='block';try{doc=await pdfjsLib.getDocument({url:url,enableXfa:true,isEvalSupported:true}).promise;pageNo=1;scale=1.25;$('bar').style.display='flex';await render()}catch(e){console.error(e);$('loading').style.display='none';$('error').style.display='block'}}async function render(){if(!doc)return;const mine=++job;$('loading').style.display='block';try{const p=await doc.getPage(pageNo);if(mine!==job)return;const view=p.getViewport({scale:scale*window.devicePixelRatio});const c=$('canvas'),ctx=c.getContext('2d');c.width=view.width;c.height=view.height;c.style.width=(view.width/window.devicePixelRatio)+'px';c.style.height=(view.height/window.devicePixelRatio)+'px';await p.render({canvasContext:ctx,viewport:view}).promise;c.style.display='block';$('count').textContent=pageNo+' / '+doc.numPages+' · '+Math.round(scale*100)+'%'}finally{$('loading').style.display='none'}}function go(n){if(doc){pageNo=Math.max(1,Math.min(doc.numPages,pageNo+n));render()}}function zoomBy(n){scale=Math.max(.75,Math.min(3,scale+n));render()}</script></body></html>
